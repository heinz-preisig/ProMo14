[project]
name = "promo-suite"
version = "0.0.1"
description = "ProMo physics-based modelling suite — Python backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "rdflib>=7.0",
    "jinja2>=3.1",
    # numpy/scipy execute the emitted python module in-service
    # (the /initial t=0 solve execs emit_python output).
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
