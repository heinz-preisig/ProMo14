<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProMo Suite</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
  header { background: #1c3a5e; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border-radius: 8px; overflow: hidden;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 10px 14px; font-size: 14px;
           border-bottom: 1px solid #eceef1; vertical-align: top; }
  th { background: #fafbfc; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; color: #5a6068; }
  tr:last-child td { border-bottom: 0; }
  .type { display: inline-block; padding: 2px 8px; border-radius: 10px;
          font-size: 12px; font-weight: 600; background: #e8eef5;
          color: #1c3a5e; }
  .status-draft { color: #0b7cbe; font-weight: 600; }
  .status-frozen { color: #5a6068; }
  .chip { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 8px;
          border-radius: 10px; font-size: 11px; background: #eef3ee;
          color: #2e8b57; font-family: ui-monospace, monospace; }
  .chip.species { background: #f1eaf7; color: #6b3fa0; }
  .ver { font-family: ui-monospace, monospace; font-size: 12px;
         white-space: nowrap; }
  .iri { font-family: ui-monospace, monospace; font-size: 11px;
         color: #8a9098; word-break: break-all; }
  button { margin-right: 6px; padding: 4px 10px; font-size: 12px;
           border: 1px solid #cdd3da; border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f0f4f8; }
  button.primary { background: #0b7cbe; border-color: #0b7cbe; color: #fff; }
  button.primary:hover { background: #096aa5; }
  button.warn { border-color: #d98600; color: #a36a00; font-weight: 600; }
  button.warn:hover { background: #fdf3e3; }
  .dirty { color: #a36a00; font-size: 12px; font-weight: 600; margin-left: 8px; }
  #newform { background: #fff; border: 1px solid #e2e6ea; border-radius: 8px;
             padding: 14px 16px; margin-bottom: 14px; display: none; }
  #newform label { display: block; font-size: 12px; font-weight: 600;
                   color: #5a6068; margin: 8px 0 2px; }
  #newform input[type=text], #newform select { width: 100%; padding: 5px 8px;
      font-size: 13px; border: 1px solid #cdd3da; border-radius: 6px;
      background: #fff; }
  #newform select[multiple] { height: 90px; }
  #newform .row { display: flex; gap: 14px; }
  #newform .row > div { flex: 1; min-width: 0; }
  #newform .actions { margin-top: 10px; }
  #msg { margin: 12px 0; font-size: 13px; color: #a33; min-height: 1em; }
  .empty { padding: 40px; text-align: center; color: #8a9098; }
  .toolbar { margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>ProMo Suite</h1>
  <p>Artefact catalogue — pick what to work on; the app follows from the artefact type.</p>
</header>
<main>
  <div class="toolbar">
    <button onclick="toggleNewForm()">New artefact…</button>
    <button id="saveBtn" onclick="saveAll()" style="display:none">Save</button>
    <span id="dirtyBadge" class="dirty" style="display:none">● unsaved changes</span>
    <a id="modeToggle" href="?dev" style="float:right;font-size:12px;color:#5a6068">dev mode</a>
  </div>
  <div id="newform">
    <div class="row">
      <div>
        <label for="nfType">Type</label>
        <select id="nfType">
          <option>ontology</option>
          <option>library</option>
          <option>assignment</option>
          <option>model</option>
          <option>glass</option>
          <option>species</option>
        </select>
      </div>
      <div>
        <label for="nfLabel">Label (optional)</label>
        <input type="text" id="nfLabel">
      </div>
    </div>
    <label for="nfIri">Graph IRI</label>
    <input type="text" id="nfIri">
    <div class="row">
      <div>
        <label for="nfUses">Ontology pins — usesOntology (draft or frozen version)</label>
        <select id="nfUses" multiple></select>
      </div>
      <div id="nfSpeciesRow">
        <label for="nfUsesSpecies">Species pins — usesSpecies</label>
        <select id="nfUsesSpecies" multiple></select>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="createArtefact()">Create</button>
      <button onclick="toggleNewForm()">Cancel</button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="catalogue"><div class="empty">Loading…</div></div>
</main>
<script>
// Which app serves which artefact type (backend-served SPA paths).
const APPS = {
  ontology:   { path: '/ontology', label: 'Ontology Editor' },
  library:    { path: '/equation', label: 'Equation Editor' },
  assignment: { path: '/behaviour', label: 'Behaviour Linker' },
  model:      { path: '/modeller', label: 'Modeller' },
  glass:      { path: '/modeller', label: 'Modeller' },
  species:    { path: '/species', label: 'Species' },
};

// Dev-mode entry split (hub ticket #6): `?dev` in the hub URL points
// Open at the Vite dev servers (dev.sh ports) instead of the
// backend-served builds.  Instantiation has no dev.sh service — it
// stays on the backend path in both modes.
const DEV = new URLSearchParams(location.search).has('dev');
const DEV_PORTS = { ontology: 3001, library: 3002, assignment: 3003,
                    model: 3004, glass: 3004, species: 3005 };

const msg = (t) => { document.getElementById('msg').textContent = t || ''; };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Unsaved changes live in the server-side store — switching artefacts
// loses nothing in memory, but nothing is on disk either.  The guard
// makes that choice explicit (hub ticket #5).
function guardDirty() {
  return !DIRTY || confirm(
    'There are unsaved changes in the store. They persist in memory ' +
    'across apps but are not written to disk — open anyway?');
}

function openArtefact(line) {
  const app = APPS[line.type];
  if (!app) { msg(`No app for artefact type "${line.type}"`); return; }
  if (!guardDirty()) return;
  const base = DEV && DEV_PORTS[line.type]
    ? `http://localhost:${DEV_PORTS[line.type]}/`
    : `${app.path}/`;
  window.location.href = `${base}?graph=${encodeURIComponent(line.iri)}`;
}

function openVersion(type, iri) {
  // Frozen versions open in the same app; writes are rejected
  // server-side by the R5 frozen guard (editable_param -> 403).
  openArtefact({ iri, type });
}

function instantiateArtefact(line) {
  if (!guardDirty()) return;
  window.location.href =
    `/instantiation/?graph=${encodeURIComponent(line.iri)}`;
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/ontology/status');
    const d = await r.json();
    DIRTY = !!d.dirty;
    document.getElementById('dirtyBadge').style.display = DIRTY ? '' : 'none';
    document.getElementById('saveBtn').style.display = DIRTY ? '' : 'none';
  } catch (e) { /* status is advisory — never block the catalogue */ }
}

async function saveAll() {
  try {
    await post('/api/ontology/save', {});
    msg('Saved.');
    refreshStatus();
  } catch (e) { msg(e.message); }
}

function exportVersion(iri, version) {
  const a = document.createElement('a');
  a.href = `/api/ontology/export?version=${encodeURIComponent(version)}` +
           `&graph=${encodeURIComponent(iri)}`;
  a.download = `ontology-${version}.ttl`;
  document.body.appendChild(a); a.click(); a.remove();
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || `${path}: ${r.status}`);
  }
  return r.json();
}

async function put(path, body) {
  const r = await fetch(path, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || `${path}: ${r.status}`);
  }
  return r.json();
}

async function pinSpecies(line) {
  const cur = (line.usesSpecies || [])[0] || '';
  const iri = prompt('Species artefact IRI to pin (empty clears):', cur);
  if (iri === null) return;
  try {
    await put('/api/catalogue/pins',
              { iri: line.iri, usesSpecies: iri.trim() ? [iri.trim()] : [] });
    location.reload();
  } catch (e) { msg(e.message); }
}

async function applyFloor(iri) {
  try {
    await post(`/api/ontology/apply-seed-floor?graph=${encodeURIComponent(iri)}`,
              {});
    location.reload();
  } catch (e) { msg(e.message); }
}

async function forkArtefact(iri) {
  const newIri = prompt('IRI for the forked artefact:', `${iri}-fork`);
  if (!newIri) return;
  const label = prompt('Label (optional):', '');
  try {
    await post('/api/catalogue/fork',
               { source: iri, new_iri: newIri, label: label || null });
    location.reload();
  } catch (e) { msg(e.message); }
}

// --- New-artefact form (replaces the prompt() chain — hub ticket #5) ---

const TYPE_DEFAULT_IRI = t => `https://w3id.org/promo/${t}s/`;

function toggleNewForm() {
  const f = document.getElementById('newform');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function onTypeChange() {
  const t = document.getElementById('nfType').value;
  const iri = document.getElementById('nfIri');
  // Refresh the default IRI only while the user hasn't edited it.
  if (!iri.dataset.touched) iri.value = TYPE_DEFAULT_IRI(t);
  document.getElementById('nfSpeciesRow').style.display =
    (t === 'model' || t === 'glass') ? '' : 'none';
}

function pinOptions() {
  // Pin candidates: every ontology/species line's draft IRI plus its
  // frozen version IRIs — pinning a version is the reproducible choice.
  for (const [id, type] of [['nfUses', 'ontology'],
                            ['nfUsesSpecies', 'species']]) {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    for (const l of LINES.filter(x => x.type === type)) {
      const d = document.createElement('option');
      d.value = l.iri; d.textContent = `${l.label} (draft)`;
      sel.appendChild(d);
      for (const v of l.versions) {
        const o = document.createElement('option');
        o.value = v.iri; o.textContent = `${l.label} @${v.version}`;
        sel.appendChild(o);
      }
    }
  }
  // Sensible default: pin the core ontology draft.
  for (const o of document.getElementById('nfUses').options)
    o.selected = o.value === 'https://w3id.org/promo/ontology';
}

const selectedValues = id =>
  Array.from(document.getElementById(id).selectedOptions).map(o => o.value);

async function createArtefact() {
  const type = document.getElementById('nfType').value;
  const iri = document.getElementById('nfIri').value.trim();
  const label = document.getElementById('nfLabel').value.trim();
  if (!iri) { msg('Graph IRI is required'); return; }
  try {
    await post('/api/catalogue/new', {
      iri, type, label: label || null,
      uses: selectedValues('nfUses'),
      uses_species: selectedValues('nfUsesSpecies') });
    location.reload();
  } catch (e) { msg(e.message); }
}

function render(lines) {
  const root = document.getElementById('catalogue');
  if (!lines.length) {
    root.innerHTML = '<div class="empty">No artefacts in the data directory.</div>';
    return;
  }
  const rows = lines.map(l => {
    const vers = l.versions.map(v =>
      `<span class="ver">${esc(v.version)}</span>` +
      ` <button onclick='openVersion(${JSON.stringify(l.type)},${JSON.stringify(v.iri)})'>open</button>` +
      (l.type === 'ontology'
        ? ` <button onclick='exportVersion(${JSON.stringify(l.iri)},${JSON.stringify(v.version)})'>export</button>`
        : '')
    ).join('<br>');
    const pins = l.usesOntology.map(p =>
      `<span class="chip" title="${esc(p)}">${esc(p.split('#').pop().split('/').pop())}</span>`
    ).join('') + (l.usesSpecies || []).map(p =>
      `<span class="chip species" title="species: ${esc(p)}">${esc(p.split('#').pop().split('/').pop())}</span>`
    ).join('');
    const app = APPS[l.type];
    const openBtn = app
      ? `<button class="primary" onclick='openArtefact(${JSON.stringify(l)})'>Open</button>`
      : '';
    const forkBtn = `<button onclick='forkArtefact(${JSON.stringify(l.iri)})'>Fork</button>`;
    const instBtn = (l.type === 'model' || l.type === 'glass')
      ? `<button onclick='instantiateArtefact(${JSON.stringify(l)})'>Instantiate</button>`
      : '';
    const pinBtn = (l.type === 'model' || l.type === 'glass') && l.status === 'draft'
      ? `<button onclick='pinSpecies(${JSON.stringify(l)})'>Species…</button>`
      : '';
    const floorBadge = l.type === 'ontology' && l.status === 'draft' && l.staleFloor
      ? `<br><button class="warn" title="seed floor ${esc(l.seedFloor || 'none')} → ${esc(CURRENT_FLOOR)} — apply the current seed floor" onclick='applyFloor(${JSON.stringify(l.iri)})'>update floor</button>`
      : '';
    return `<tr>
      <td><strong>${esc(l.label)}</strong><br><span class="iri">${esc(l.iri)}</span></td>
      <td><span class="type">${esc(l.type)}</span></td>
      <td class="status-${l.status}">${esc(l.status)}${floorBadge}</td>
      <td>${vers}</td>
      <td>${pins}</td>
      <td>${openBtn}${instBtn}${pinBtn}${forkBtn}</td>
    </tr>`;
  }).join('');
  root.innerHTML = `<table>
    <thead><tr><th>Artefact</th><th>Type</th><th>Status</th>
    <th>Versions</th><th>Pins</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

let CURRENT_FLOOR = '';
let DIRTY = false;
let LINES = [];

// Mode toggle: offer the opposite of the current mode.
{
  const t = document.getElementById('modeToggle');
  if (DEV) { t.textContent = 'user mode'; t.href = location.pathname; }
}

document.getElementById('nfType').addEventListener('change', onTypeChange);
document.getElementById('nfIri').addEventListener('input',
  e => { e.target.dataset.touched = '1'; });
onTypeChange();

fetch('/api/catalogue')
  .then(r => { if (!r.ok) throw new Error(`catalogue: ${r.status}`); return r.json(); })
  .then(d => {
    CURRENT_FLOOR = d.seedFloor || '';
    LINES = d.lines;
    pinOptions();
    render(d.lines);
  })
  .catch(e => { msg(`Failed to load catalogue: ${e.message}`);
                document.getElementById('catalogue').innerHTML = ''; });

refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
