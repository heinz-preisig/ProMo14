<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProMo Suite</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
  header { background: #1c3a5e; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff;
          border-radius: 8px; overflow: hidden;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  th, td { text-align: left; padding: 10px 14px; font-size: 14px;
           border-bottom: 1px solid #eceef1; vertical-align: top; }
  th { background: #fafbfc; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; color: #5a6068; }
  tr:last-child td { border-bottom: 0; }
  .type { display: inline-block; padding: 2px 8px; border-radius: 10px;
          font-size: 12px; font-weight: 600; background: #e8eef5;
          color: #1c3a5e; }
  .status-draft { color: #0b7cbe; font-weight: 600; }
  .status-frozen { color: #5a6068; }
  .chip { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 8px;
          border-radius: 10px; font-size: 11px; background: #eef3ee;
          color: #2e8b57; font-family: ui-monospace, monospace; }
  .chip.species { background: #f1eaf7; color: #6b3fa0; }
  .ver { font-family: ui-monospace, monospace; font-size: 12px;
         white-space: nowrap; }
  .iri { font-family: ui-monospace, monospace; font-size: 11px;
         color: #8a9098; word-break: break-all; }
  button { margin-right: 6px; padding: 4px 10px; font-size: 12px;
           border: 1px solid #cdd3da; border-radius: 6px;
           background: #fff; cursor: pointer; }
  button:hover { background: #f0f4f8; }
  button.primary { background: #0b7cbe; border-color: #0b7cbe; color: #fff; }
  button.primary:hover { background: #096aa5; }
  #msg { margin: 12px 0; font-size: 13px; color: #a33; min-height: 1em; }
  .empty { padding: 40px; text-align: center; color: #8a9098; }
  .toolbar { margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>ProMo Suite</h1>
  <p>Artefact catalogue — pick what to work on; the app follows from the artefact type.</p>
</header>
<main>
  <div class="toolbar">
    <button onclick="newArtefact()">New artefact…</button>
  </div>
  <div id="msg"></div>
  <div id="catalogue"><div class="empty">Loading…</div></div>
</main>
<script>
// Which app serves which artefact type (backend-served SPA paths).
const APPS = {
  ontology:   { path: '/ontology', label: 'Ontology Editor' },
  library:    { path: '/equation', label: 'Equation Editor' },
  assignment: { path: '/behaviour', label: 'Behaviour Linker' },
  model:      { path: '/modeller', label: 'Modeller' },
  glass:      { path: '/modeller', label: 'Modeller' },
  species:    { path: '/species', label: 'Species' },
};

const msg = (t) => { document.getElementById('msg').textContent = t || ''; };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openArtefact(line) {
  const app = APPS[line.type];
  if (!app) { msg(`No app for artefact type "${line.type}"`); return; }
  window.location.href = `${app.path}/?graph=${encodeURIComponent(line.iri)}`;
}

function instantiateArtefact(line) {
  window.location.href =
    `/instantiation/?graph=${encodeURIComponent(line.iri)}`;
}

function exportVersion(iri, version) {
  const a = document.createElement('a');
  a.href = `/api/ontology/export?version=${encodeURIComponent(version)}` +
           `&graph=${encodeURIComponent(iri)}`;
  a.download = `ontology-${version}.ttl`;
  document.body.appendChild(a); a.click(); a.remove();
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || `${path}: ${r.status}`);
  }
  return r.json();
}

async function put(path, body) {
  const r = await fetch(path, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.detail || `${path}: ${r.status}`);
  }
  return r.json();
}

async function pinSpecies(line) {
  const cur = (line.usesSpecies || [])[0] || '';
  const iri = prompt('Species artefact IRI to pin (empty clears):', cur);
  if (iri === null) return;
  try {
    await put('/api/catalogue/pins',
              { iri: line.iri, usesSpecies: iri.trim() ? [iri.trim()] : [] });
    location.reload();
  } catch (e) { msg(e.message); }
}

async function forkArtefact(iri) {
  const newIri = prompt('IRI for the forked artefact:', `${iri}-fork`);
  if (!newIri) return;
  const label = prompt('Label (optional):', '');
  try {
    await post('/api/catalogue/fork',
               { source: iri, new_iri: newIri, label: label || null });
    location.reload();
  } catch (e) { msg(e.message); }
}

async function newArtefact() {
  const type = prompt('Artefact type (ontology, library, assignment, model, glass):', 'ontology');
  if (!type) return;
  const iri = prompt('Graph IRI for the new artefact:', `https://w3id.org/promo/${type}s/`);
  if (!iri) return;
  const label = prompt('Label (optional):', '');
  const uses = prompt('Ontology pins — comma-separated graph IRIs (optional):',
                      'https://w3id.org/promo/ontology');
  let usesSpecies = [];
  if (type === 'model' || type === 'glass') {
    const sp = prompt('Species artefact pin — graph IRI (optional):', '');
    if (sp && sp.trim()) usesSpecies = [sp.trim()];
  }
  try {
    await post('/api/catalogue/new', {
      iri, type, label: label || null,
      uses: uses ? uses.split(',').map(s => s.trim()).filter(Boolean) : [],
      uses_species: usesSpecies });
    location.reload();
  } catch (e) { msg(e.message); }
}

function render(lines) {
  const root = document.getElementById('catalogue');
  if (!lines.length) {
    root.innerHTML = '<div class="empty">No artefacts in the data directory.</div>';
    return;
  }
  const rows = lines.map(l => {
    const vers = l.versions.map(v =>
      `<span class="ver">${esc(v.version)}</span>` +
      (l.type === 'ontology'
        ? ` <button onclick='exportVersion(${JSON.stringify(l.iri)},${JSON.stringify(v.version)})'>export</button>`
        : '')
    ).join('<br>');
    const pins = l.usesOntology.map(p =>
      `<span class="chip" title="${esc(p)}">${esc(p.split('#').pop().split('/').pop())}</span>`
    ).join('') + (l.usesSpecies || []).map(p =>
      `<span class="chip species" title="species: ${esc(p)}">${esc(p.split('#').pop().split('/').pop())}</span>`
    ).join('');
    const app = APPS[l.type];
    const openBtn = app
      ? `<button class="primary" onclick='openArtefact(${JSON.stringify(l)})'>Open</button>`
      : '';
    const forkBtn = `<button onclick='forkArtefact(${JSON.stringify(l.iri)})'>Fork</button>`;
    const instBtn = (l.type === 'model' || l.type === 'glass')
      ? `<button onclick='instantiateArtefact(${JSON.stringify(l)})'>Instantiate</button>`
      : '';
    const pinBtn = (l.type === 'model' || l.type === 'glass') && l.status === 'draft'
      ? `<button onclick='pinSpecies(${JSON.stringify(l)})'>Species…</button>`
      : '';
    return `<tr>
      <td><strong>${esc(l.label)}</strong><br><span class="iri">${esc(l.iri)}</span></td>
      <td><span class="type">${esc(l.type)}</span></td>
      <td class="status-${l.status}">${esc(l.status)}</td>
      <td>${vers}</td>
      <td>${pins}</td>
      <td>${openBtn}${instBtn}${pinBtn}${forkBtn}</td>
    </tr>`;
  }).join('');
  root.innerHTML = `<table>
    <thead><tr><th>Artefact</th><th>Type</th><th>Status</th>
    <th>Versions</th><th>Pins</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

fetch('/api/catalogue')
  .then(r => { if (!r.ok) throw new Error(`catalogue: ${r.status}`); return r.json(); })
  .then(d => render(d.lines))
  .catch(e => { msg(`Failed to load catalogue: ${e.message}`);
                document.getElementById('catalogue').innerHTML = ''; });
</script>
</body>
</html>
